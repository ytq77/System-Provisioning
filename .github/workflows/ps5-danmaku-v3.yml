name: PS5 danmaku-v3

on:
  pull_request:
    paths:
      - 'ps5_twittch/danmaku-v3/**'
      - '.github/workflows/ps5-danmaku-v3.yml'
  push:
    paths:
      - 'ps5_twittch/danmaku-v3/**'
      - '.github/workflows/ps5-danmaku-v3.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ps5_twittch/danmaku-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile danmaku_forward.py stream_routing.py monitor_rtmp.py
      - run: node --check static/stream_routing.js
      - run: docker compose config --quiet
